name: Pose asset digest probe
on:
  pull_request:
    paths:
      - frontend/scripts/prepare_pose_assets.mjs
      - .github/workflows/pose-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Inspect version-pinned official artifacts
        run: node frontend/scripts/prepare_pose_assets.mjs --inspect
