name: BODYVISION Pose Retention Acceptance
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/pose-retention.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bodyvision-pose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pose-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-bookworm@sha256:72ccb1ad4dc9d5813ea40a8c1c87af746f16658fb029c17fe570ea9b881f68b3
        env:
          POSTGRES_DB: bodyvision
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [127.0.0.1:5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bodyvision_app@127.0.0.1:5432/bodyvision
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/bodyvision
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/bodyvision
      AUTH_DATABASE_URL: postgresql+psycopg://bodyvision_auth_app@127.0.0.1:5432/bodyvision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install locked backend test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Set up strictly disposable SQL roles
        run: |
          psql 'postgresql://postgres@127.0.0.1:5432/bodyvision' -v ON_ERROR_STOP=1 -c 'CREATE ROLE bodyvision_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS; REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT USAGE ON SCHEMA public TO bodyvision_app;'
          psql 'postgresql://postgres@127.0.0.1:5432/bodyvision' -v ON_ERROR_STOP=1 -c 'CREATE ROLE bodyvision_auth_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;'
      - name: Apply schema and audit pose-retention code style
        working-directory: backend
        run: |
          ruff check alembic/versions/0021_pose_retention.py app/workers/capture_retention.py app/workers/independent_capture_retention.py tests/integration/test_pose_summary_retention.py
          ruff format --check alembic/versions/0021_pose_retention.py app/workers/capture_retention.py app/workers/independent_capture_retention.py tests/integration/test_pose_summary_retention.py
          alembic upgrade head
      - name: Verify private pose API, consent erasure and independent worker
        working-directory: backend
        timeout-minutes: 5
        run: |
          pytest -q -x -o faulthandler_timeout=90 \
            tests/unit/test_capture_retention.py \
            tests/unit/test_capture_retention_runner_guard.py \
            tests/integration/test_pose_summary_api.py \
            tests/integration/test_pose_summary_retention.py
      - name: Verify migration can be rolled back and restored
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head
